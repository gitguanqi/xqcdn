# xqcdn 目录列表指令
#
# 这个片段被 deploy/nginx.conf.example 在多个 location 里 include，
# 保证挂在 "/" 与挂在 "/cqcdn/" 时行为完全一致。

fancyindex on;
fancyindex_localtime on;
fancyindex_exact_size off;
fancyindex_name_length 255;
fancyindex_header "/fancyindex/header.html";
fancyindex_footer "/fancyindex/footer.html";
fancyindex_ignore ".git";
fancyindex_ignore ".github";
fancyindex_ignore ".workbuddy";

# 主题的「每目录模板」依赖 SSI：<!--# include virtual="$request_uri/.directory_index.html" -->
ssi on;
charset utf-8;
